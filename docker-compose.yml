services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rewardgate-console
    command: ["serve", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "8765:8765"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rewardgate-evaluator
    command: ["version"]
    volumes:
      - ./eval_reports:/app/eval_reports
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2048M
