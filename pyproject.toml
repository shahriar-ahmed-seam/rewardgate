[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardgate"
version = "0.1.0"
description = "Gated Hierarchical RL Reward and Anti-Gaming Evaluation Harness for Code LLMs"
readme = "README.md"
authors = [
    { name = "RewardGate Team", email = "engineering@rewardgate.dev" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
trl = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "trl>=0.8.0",
]

[project.scripts]
rewardgate = "rewardgate.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
